<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 540 720" width="100%" height="100%">
  <defs>
    <!-- Cross 3D Red Gradient -->
    <radialGradient id="asarRedGrad" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#E81735" />
      <stop offset="65%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#930B1E" />
    </radialGradient>

    <!-- Metallic Compass Dial Gradient -->
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F3F4F6" />
      <stop offset="70%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>

    <!-- Drop Shadows for 3D Crest Badge -->
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Path for Top Ribbon Curved Text "ASAR" -->
    <path id="topRibbonArc" d="M 120,95 Q 270,30 420,95" fill="none" />

    <!-- Path for Lower Ribbon Curved Text "TRAD.&CONT.CO. L.L.C" -->
    <path id="lowerRibbonArc" d="M 80,595 Q 270,520 460,595" fill="none" />
  </defs>

  <g id="official-asar-emblem" filter="url(#crestShadow)">
    
    <!-- 1. BACK SHIELD SILHOUETTE (Black outer chassis) -->
    <path d="M 270,12 
             C 345,12 420,45 450,90 
             C 475,125 490,185 490,260 
             C 525,310 525,390 490,440 
             C 490,520 470,570 430,610 
             L 515,622 L 520,700 L 20,700 L 25,622 L 110,610 
             C 70,570 50,520 50,440 
             C 15,390 15,310 50,260 
             C 50,185 65,125 90,90 
             C 120,45 195,12 270,12 Z" 
          fill="#111827" stroke="#111827" stroke-width="4" stroke-linejoin="round" />

    <!-- 2. WHITE INTERIOR CONTOUR LINE -->
    <path d="M 270,18 
             C 340,18 412,49 440,92 
             C 464,126 478,185 478,260 
             C 510,310 510,386 478,436 
             C 478,512 458,562 422,600 
             L 505,612 L 510,690 L 30,690 L 35,612 L 118,600 
             C 82,562 62,512 62,436 
             C 30,386 30,310 62,260 
             C 62,185 76,126 100,92 
             C 128,49 200,18 270,18 Z" 
          fill="#FFFFFF" />

    <!-- 3. MAIN MALTESE CROSS BACKGROUND -->
    <g id="cross-arms">
      <!-- Outer Base Circle -->
      <circle cx="270" cy="350" r="215" fill="url(#asarRedGrad)" stroke="#111827" stroke-width="3" />
      <circle cx="270" cy="350" r="202" fill="none" stroke="#FFFFFF" stroke-width="6" />

      <!-- Top Flared Petal -->
      <path d="M 198,280 L 100,132 C 190,160 350,160 440,132 L 342,280 Z" 
            fill="url(#asarRedGrad)" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 206,270 L 122,146 C 200,168 340,168 418,146 L 334,270 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

      <!-- Bottom Flared Petal -->
      <path d="M 198,420 L 100,568 C 190,540 350,540 440,568 L 342,420 Z" 
            fill="url(#asarRedGrad)" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 206,430 L 122,554 C 200,532 340,532 418,554 L 334,430 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

      <!-- Left Flared Petal -->
      <g transform="rotate(270 270 350)">
        <path d="M 198,280 L 100,132 C 190,160 350,160 440,132 L 342,280 Z" 
              fill="url(#asarRedGrad)" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
        <path d="M 206,270 L 122,146 C 200,168 340,168 418,146 L 334,270 Z" 
              fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      </g>

      <!-- Right Flared Petal -->
      <g transform="rotate(90 270 350)">
        <path d="M 198,280 L 100,132 C 190,160 350,160 440,132 L 342,280 Z" 
              fill="url(#asarRedGrad)" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
        <path d="M 206,270 L 122,146 C 200,168 340,168 418,146 L 334,270 Z" 
              fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 4. QUADRANT LETTERS: S (top), A (left), A (right), R (bottom) -->
    <g id="petal-letters" font-family="'Times New Roman', 'Georgia', serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      <!-- Top Arm: S -->
      <text x="270" y="235" font-size="105" stroke="#111827" stroke-width="4" paint-order="stroke fill">S</text>
      <!-- Left Arm: A -->
      <text x="130" y="380" font-size="105" stroke="#111827" stroke-width="4" paint-order="stroke fill">A</text>
      <!-- Right Arm: A -->
      <text x="410" y="380" font-size="105" stroke="#111827" stroke-width="4" paint-order="stroke fill">A</text>
      <!-- Bottom Arm: R -->
      <text x="270" y="525" font-size="105" stroke="#111827" stroke-width="4" paint-order="stroke fill">R</text>
    </g>

    <!-- 5. CENTRAL NAVIGATION COMPASS ROSE DIAL -->
    <g id="compass-dial">
      <!-- Outer Dial Borders -->
      <circle cx="270" cy="350" r="88" fill="#111827" stroke="#FFFFFF" stroke-width="4" />
      <circle cx="270" cy="350" r="83" fill="url(#dialGrad)" stroke="#111827" stroke-width="2.5" />
      <circle cx="270" cy="350" r="70" fill="#FFFFFF" stroke="#C8102E" stroke-width="2" />
      <circle cx="270" cy="350" r="66" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="0.8" />

      <!-- Compass Degree Ticks (360 Degree Dial) -->
      <g stroke="#374151" stroke-width="1.2">
        <line x1="270" y1="268" x2="270" y2="276" stroke-width="2" stroke="#C8102E" />
        <line x1="270" y1="432" x2="270" y2="424" stroke-width="2" stroke="#C8102E" />
        <line x1="188" y1="350" x2="196" y2="350" stroke-width="2" stroke="#C8102E" />
        <line x1="352" y1="350" x2="344" y2="350" stroke-width="2" stroke="#C8102E" />

        <line x1="212" y1="292" x2="218" y2="298" stroke-width="1.5" />
        <line x1="328" y1="408" x2="322" y2="402" stroke-width="1.5" />
        <line x1="212" y1="408" x2="218" y2="402" stroke-width="1.5" />
        <line x1="328" y1="292" x2="322" y2="298" stroke-width="1.5" />
      </g>

      <!-- Compass Degree Numbers -->
      <g font-family="'Arial', sans-serif" font-size="6.5" font-weight="700" fill="#6B7280" text-anchor="middle">
        <text x="270" y="278">0</text>
        <text x="323" y="300">45</text>
        <text x="343" y="352">90</text>
        <text x="324" y="405">135</text>
        <text x="270" y="426">180</text>
        <text x="216" y="405">225</text>
        <text x="197" y="352">270</text>
        <text x="217" y="300">315</text>
      </g>

      <!-- Direction Labels -->
      <g font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#C8102E" text-anchor="middle">
        <text x="270" y="289">N</text>
        <text x="270" y="416">S</text>
        <text x="333" y="353">E</text>
        <text x="207" y="353">W</text>
      </g>
      <g font-family="'Arial', sans-serif" font-size="6" font-weight="bold" fill="#374151" text-anchor="middle">
        <text x="314" y="309">NE</text>
        <text x="226" y="309">NW</text>
        <text x="314" y="396">SE</text>
        <text x="226" y="396">SW</text>
      </g>

      <!-- 16-Point Faceted Compass Star -->
      <g id="compass-star-points">
        <!-- North Point -->
        <polygon points="270,350 270,288 274,350" fill="#C8102E" />
        <polygon points="270,350 270,288 266,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />

        <!-- South Point -->
        <polygon points="270,350 270,412 266,350" fill="#C8102E" />
        <polygon points="270,350 270,412 274,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />

        <!-- East Point -->
        <polygon points="270,350 332,350 270,354" fill="#C8102E" />
        <polygon points="270,350 332,350 270,346" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />

        <!-- West Point -->
        <polygon points="270,350 208,350 270,346" fill="#C8102E" />
        <polygon points="270,350 208,350 270,354" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />

        <!-- 45-deg Cardinal Points -->
        <g transform="rotate(45 270 350)">
          <polygon points="270,350 270,298 273,350" fill="#C8102E" />
          <polygon points="270,350 270,298 267,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
          <polygon points="270,350 270,402 267,350" fill="#C8102E" />
          <polygon points="270,350 270,402 273,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
          <polygon points="270,350 322,350 270,353" fill="#C8102E" />
          <polygon points="270,350 322,350 270,347" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
          <polygon points="270,350 218,350 270,347" fill="#C8102E" />
          <polygon points="270,350 218,350 270,353" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
        </g>

        <!-- 22.5-deg Intermediate Points -->
        <g transform="rotate(22.5 270 350)">
          <polygon points="270,350 270,308 272,350" fill="#C8102E" />
          <polygon points="270,350 270,308 268,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
          <polygon points="270,350 270,392 268,350" fill="#C8102E" />
          <polygon points="270,350 270,392 272,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
        </g>
        <g transform="rotate(67.5 270 350)">
          <polygon points="270,350 270,308 272,350" fill="#C8102E" />
          <polygon points="270,350 270,308 268,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
          <polygon points="270,350 270,392 268,350" fill="#C8102E" />
          <polygon points="270,350 270,392 272,350" fill="#FFFFFF" stroke="#930B1E" stroke-width="0.5" />
        </g>
        
        <!-- Central Gem Pivot -->
        <circle cx="270" cy="350" r="7" fill="#C8102E" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>

    <!-- 6. TOP RIBBON BANNER: "ASAR" -->
    <g id="top-banner-ribbon">
      <!-- Ribbon Back Folds -->
      <path d="M 115,95 L 145,125 L 130,140 Z" fill="#7A0918" />
      <path d="M 425,95 L 395,125 L 410,140 Z" fill="#7A0918" />
      
      <!-- Ribbon Left & Right Swallow Tails -->
      <path d="M 110,95 L 150,55 L 152,115 L 105,110 Z" fill="#C8102E" stroke="#111827" stroke-width="3" />
      <path d="M 430,95 L 390,55 L 388,115 L 435,110 Z" fill="#C8102E" stroke="#111827" stroke-width="3" />
      
      <!-- Ribbon Front Arch -->
      <path d="M 125,115 Q 270,45 415,115 L 405,65 Q 270,0 135,65 Z" 
            fill="#C8102E" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
      <path d="M 134,107 Q 270,40 406,107" 
            fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <path d="M 144,72 Q 270,10 396,72" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Text: ASAR (with both standard text and textPath for universal support) -->
      <text font-family="'Times New Roman', 'Georgia', serif" font-weight="900" font-size="52" fill="#FFFFFF" stroke="#111827" stroke-width="2" paint-order="stroke fill">
        <textPath xlink:href="#topRibbonArc" href="#topRibbonArc" startOffset="50%" text-anchor="middle">ASAR</textPath>
      </text>
    </g>

    <!-- 7. LOWER RIBBON BANNER: "TRAD.&CONT.CO. L.L.C" -->
    <g id="lower-banner-ribbon">
      <!-- Ribbon Left & Right Flairs -->
      <path d="M 75,570 L 115,595 L 90,625 Z" fill="#7A0918" />
      <path d="M 465,570 L 425,595 L 450,625 Z" fill="#7A0918" />
      
      <!-- Lower Ribbon Main Arch -->
      <path d="M 70,590 Q 270,515 470,590 L 455,645 Q 270,570 85,645 Z" 
            fill="#C8102E" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
      <path d="M 78,598 Q 270,525 462,598" 
            fill="none" stroke="#FFFFFF" stroke-width="4" />
      <path d="M 94,638 Q 270,562 446,638" 
            fill="none" stroke="#FFFFFF" stroke-width="3" />

      <!-- Lower Ribbon Text -->
      <text font-family="'Times New Roman', 'Georgia', serif" font-weight="900" font-size="31" fill="#FFFFFF" stroke="#111827" stroke-width="1.8" paint-order="stroke fill" letter-spacing="1.5">
        <textPath xlink:href="#lowerRibbonArc" href="#lowerRibbonArc" startOffset="50%" text-anchor="middle">TRAD.&amp;CONT.CO. L.L.C</textPath>
      </text>
    </g>

    <!-- 8. BOTTOM PLAQUE: "AL SAHAB AL RASID" -->
    <g id="bottom-plaque-block">
      <!-- Outer Plaque Shape with Rounded Ends -->
      <rect x="22" y="628" width="496" height="74" rx="16" fill="#C8102E" stroke="#111827" stroke-width="4.5" />
      <rect x="28" y="634" width="484" height="62" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
      
      <!-- High Impact Block Text: AL SAHAB AL RASID -->
      <text x="270" y="680" 
            font-family="'Impact', 'Arial Black', sans-serif" 
            font-size="41" 
            font-weight="900" 
            fill="#FFFFFF" 
            stroke="#111827" 
            stroke-width="2.5" 
            paint-order="stroke fill" 
            text-anchor="middle" 
            letter-spacing="2.5">
        AL SAHAB AL RASID
      </text>
    </g>

  </g>
</svg>
